name: ZXP
# Builds a self-signed ZXP on Windows (the signing tool has no Linux build). Download it from the run's
# artifacts; tagged pushes (v0.1.0, …) also attach it to a GitHub release. See docs/INSTALL.md.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zxp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run zxp
      - uses: actions/upload-artifact@v4
        with:
          name: expression-suite-zxp
          path: dist/zxp/*.zxp
          retention-days: 30
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/zxp/*.zxp
