name: ZXP
# Optional: builds a ZXP signed with a throwaway certificate on Windows (the signing tool has no Linux build).
# The usual route is to sign CI's `expression-suite-panel` artifact with your own certificate (docs/INSTALL.md),
# so this only runs when started by hand or on a version tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zxp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run zxp
      - uses: actions/upload-artifact@v4
        with:
          name: expression-suite-zxp
          path: dist/zxp/*.zxp
          retention-days: 30
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/zxp/*.zxp
